name: addon-selftest

on: workflow_dispatch

jobs:
  selftest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SnowLuma package
        shell: pwsh
        run: ./fetch.ps1

      - name: Show files
        shell: pwsh
        run: |
          "node : $(Test-Path .\node.exe)"
          "addon: $(Test-Path .\native\snowluma-win32-x64.node)"
          "dll  : $(Test-Path .\native\snowluma-win32-x64.dll)"
          .\node.exe --version

      - name: Run addon probe
        shell: pwsh
        run: |
          .\node.exe .\addon-probe.cjs .\native\snowluma-win32-x64.node "C:\Windows\System32\kernel32.dll"